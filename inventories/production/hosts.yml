---
all:
  vars:
    ansible_user: ubuntu
    ansible_become: true

  children:
    k3s_cluster:
      children:
        k3s_servers:
          children:
            # Exactly one host initializes the embedded-etcd cluster.
            k3s_bootstrap:
              hosts:
                k3s-server-1:
                  ansible_host: 10.0.0.11
                  k3s_node_ip: 10.0.0.11

            # Add server nodes here. Keep the total server count odd.
            k3s_server_joiners:
              hosts:
                k3s-server-2:
                  ansible_host: 10.0.0.12
                  k3s_node_ip: 10.0.0.12
                k3s-server-3:
                  ansible_host: 10.0.0.13
                  k3s_node_ip: 10.0.0.13

        k3s_agents:
          hosts:
            k3s-worker-1:
              ansible_host: 10.0.0.21
              k3s_node_ip: 10.0.0.21
            k3s-worker-2:
              ansible_host: 10.0.0.22
              k3s_node_ip: 10.0.0.22
            k3s-worker-3:
              ansible_host: 10.0.0.23
              k3s_node_ip: 10.0.0.23
